name: test-quality

on:
  workflow_call:
    inputs:
      native-artifacts-ready:
        description: Use the native artifacts already built by the caller in this run.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native-candidate-diagnostic:
        description: Compare the pinned and locally patched Codex Windows runtime.
        type: boolean
        default: false
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: test-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_SECURITY_INTEGRATION: "0"
  CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"

jobs:
  native:
    if: ${{ !inputs.native-artifacts-ready }}
    uses: ./.github/workflows/native-artifacts.yml

  runner:
    needs: native
    if: ${{ !inputs.native-candidate-diagnostic && !cancelled() && (inputs.native-artifacts-ready || needs.native.result == 'success') }}
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && (matrix.mode == 'baseline' && 240 || matrix.mode == 'parallel' && 150 || 120) || 30 }}
    env:
      CODEX_SECURITY_PROPERTY_SEED: ${{ github.event_name == 'pull_request' && 1 || github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [baseline, isolated, parallel]
        exclude:
          - os: windows-latest
            mode: isolated
        include:
          - mode: baseline
            args: ""
          - mode: isolated
            args: --isolate
          - mode: parallel
            args: --parallel=2
          - os: windows-latest
            mode: isolated-1
            args: --isolate --shard=1/7
          - os: windows-latest
            mode: isolated-2
            args: --isolate --shard=2/7
          - os: windows-latest
            mode: isolated-3
            args: --isolate --shard=3/7
          - os: windows-latest
            mode: isolated-4
            args: --isolate --shard=4/7
          - os: windows-latest
            mode: isolated-5
            args: --isolate --shard=5/7
          - os: windows-latest
            mode: isolated-6
            args: --isolate --shard=6/7
          - os: windows-latest
            mode: isolated-7
            args: --isolate --shard=7/7
          - os: windows-latest
            mode: shard-1
            args: --shard=1/7
          - os: windows-latest
            mode: shard-2
            args: --shard=2/7
          - os: windows-latest
            mode: shard-3
            args: --shard=3/7
          - os: windows-latest
            mode: shard-4
            args: --shard=4/7
          - os: windows-latest
            mode: shard-5
            args: --shard=5/7
          - os: windows-latest
            mode: shard-6
            args: --shard=6/7
          - os: windows-latest
            mode: shard-7
            args: --shard=7/7
    steps:
      - &actions-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare native runtime
        uses: ./.github/actions/download-native
      - &actions-setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        uses: ./.github/actions/setup-tools
        with:
          setup-node: false
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: runner.os == 'Windows'
        with:
          bun-version: "1.4.2"
      - name: Set up Bun on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Includes the subprocess fix from https://github.com/oven-sh/bun/pull/44581
          # for the isolated-runner hang tracked in https://github.com/oven-sh/bun/issues/34069.
          npm install --prefix "$RUNNER_TEMP/bun" --ignore-scripts --no-audit --no-fund @oven/bun-linux-x64@1.4.2-canary.20261008.1
          echo "$RUNNER_TEMP/bun/node_modules/@oven/bun-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Set up the Ubuntu sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Prepare private Windows test root
        if: runner.os == 'Windows'
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test runner mode
        env:
          CODEX_SECURITY_TEST_TIMEOUT_MS: ${{ runner.os == 'Windows' && '120000' || '30000' }}
          TEMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMPDIR: ${{ steps.windows-temp.outputs.path || runner.temp }}
        run: |
          node -e "require('node:fs').mkdirSync('sdk/typescript/reports',{recursive:true})"
          pnpm --dir sdk/typescript run test ${{ runner.os == 'Windows' && '--timeout=120000' || '' }} ${{ matrix.args }} --seed=${{ env.CODEX_SECURITY_PROPERTY_SEED }} --reporter=junit --reporter-outfile=reports/runner-${{ matrix.os }}-${{ matrix.mode }}.xml
      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ matrix.os }}-${{ matrix.mode }}
          overwrite: true
          path: sdk/typescript/reports/runner-*.xml
          if-no-files-found: error
          retention-days: 14

  native-candidate:
    if: inputs.native-candidate-diagnostic
    name: Build patched Codex Windows runtime
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - name: Checkout pinned public Codex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: 83086188ae0614bd882818ff1aa23f3194962012
          persist-credentials: false
      - name: Checkout reviewed diagnostic patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostic-wrapper
          persist-credentials: false
      - name: Select the temporary native build directory
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP codex-candidate-target)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Apply the workspace lock prerequisite and reviewed native fixes
        shell: pwsh
        run: |
          git apply --check diagnostic-wrapper/.github/patches/native-workspace-lock.patch diagnostic-wrapper/.github/patches/native-read-roots.patch diagnostic-wrapper/.github/patches/native-cache-permissions.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply diagnostic-wrapper/.github/patches/native-workspace-lock.patch diagnostic-wrapper/.github/patches/native-read-roots.patch diagnostic-wrapper/.github/patches/native-cache-permissions.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          exit $LASTEXITCODE
      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
      - name: Set up Python for pinned V8 input verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up MSVC from the pinned source
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Prepare checksum-verified V8 inputs from the pinned source
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Build matching Windows executables
        working-directory: codex-rs
        shell: pwsh
        run: |
          $env:STABLE_GIT_COMMIT = git rev-parse HEAD
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-windows-sandbox-setup --bin codex-windows-sandbox-service --bin codex-command-runner --bin codex-app-server
          exit $LASTEXITCODE
      - name: Check explicit read roots, policy identity, and retained denies
        working-directory: codex-rs
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "native-candidate"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-protocol --lib explicit_readable_roots -- --nocapture 2>&1 | Tee-Object -Variable result | Tee-Object -FilePath "$output/native-tests.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($result | Out-String) -notmatch 'running [1-9][0-9]* tests?') { throw "Protocol test filter selected no cases" }
          $filters = @(
            "full_read_payload_retains_explicit_external_read_roots",
            "full_read_roots_preserve_legacy_platform_defaults",
            "workspace_write_roots_remain_readable",
            "setup_refresh_preserves_workspace_scoped_deny_read_paths",
            "elevated_filesystem_policy_requires_effective_root_read_access",
            "setup_provisioning::acl_tests::concurrent_policy_refreshes_preserve_scoped_root_grants",
            "cap::tests::write_policy_capabilities_",
            "setup_provisioning::acl_tests::snapshot_capability_preserves_model_and_legacy_write_denies",
            "spawn_prep::tests::root_capability_sids_only_include_active_roots",
            "spawn_prep::tests::legacy_deny_path_includes_nested_active_root_sid",
            "setup_provisioning::tests::deny_path_",
            "setup_provisioning::tests::write_root_refresh_"
          )
          foreach ($filter in $filters) {
            cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-windows-sandbox --lib $filter -- --nocapture 2>&1 | Tee-Object -Variable result | Tee-Object -FilePath "$output/native-tests.log" -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (($result | Out-String) -notmatch 'running [1-9][0-9]* tests?') { throw "Native test filter selected no cases: $filter" }
          }
      - name: Stage candidate and source provenance
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "native-candidate"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $names = @("codex", "codex-code-mode-host", "codex-responses-api-proxy", "codex-windows-sandbox-setup", "codex-windows-sandbox-service", "codex-command-runner", "codex-app-server")
          foreach ($name in $names) {
            Copy-Item "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/$name.exe" $output
          }
          git rev-parse HEAD "HEAD^{tree}" | Set-Content "$output/upstream-source.txt"
          git -C diagnostic-wrapper rev-parse HEAD "HEAD^{tree}" | Set-Content "$output/wrapper-source.txt"
          git diff --binary --output="$output/native-source.patch"
          rustup run 1.95.0 rustc --version --verbose | Set-Content "$output/rust-toolchain.txt"
          Get-ChildItem "$output/*.exe" | Get-FileHash -Algorithm SHA256 | Select-Object Path, Hash | ConvertTo-Json | Set-Content "$output/executables.json"
      - name: Upload native candidate or failed native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidate/
          if-no-files-found: warn
          retention-days: 7

  native-candidate-diagnostic:
    if: inputs.native-candidate-diagnostic
    needs: [native, native-candidate]
    name: Native diagnostic / ${{ matrix.runtime }} / Bun ${{ matrix.bun }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CODEX_CLI_PATH: ""
    strategy:
      fail-fast: false
      matrix:
        runtime: [stock, candidate]
        bun: ["1.3.14", "1.4.2"]
    steps:
      - name: Checkout bound wrapper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare wrapper native primitives
        uses: ./.github/actions/download-native
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install the stock package and project the plugin
        shell: pwsh
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir sdk/typescript run build:plugin
          exit $LASTEXITCODE
      - name: Download candidate payload
        if: matrix.runtime == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidate
      - name: Bind both native launch paths to the selected payload
        shell: pwsh
        env:
          DIAGNOSTIC_RUNTIME: ${{ matrix.runtime }}
        run: node .github/scripts/stage-native-candidate.mjs
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Run original explicit-config and optional-cache assertions
        shell: pwsh
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
        run: |
          $output = "sdk/typescript/reports/native-candidate-diagnostic"
          node .github/scripts/prepare-diagnostic.mjs . $output --sibling --run 2>&1 | Tee-Object -FilePath "$output/read-roots.log"
          $readResult = $LASTEXITCODE
          Push-Location sdk/typescript
          bun test --timeout 120000 --test-name-pattern "^optional cache keeps model protection and inherited snapshot access:" ./tests-ts/cli-patch-native-profile.test.ts 2>&1 | Tee-Object -FilePath "reports/native-candidate-diagnostic/cache.log"
          $cacheResult = $LASTEXITCODE
          Pop-Location
          @{readRootsExit = $readResult; cacheExit = $cacheResult} | ConvertTo-Json | Set-Content "$output/test-exits.json"
          if ($readResult -ne 0 -or $cacheResult -ne 0) { exit 1 }
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostic-${{ github.sha }}-${{ matrix.runtime }}-bun-${{ matrix.bun }}
          path: sdk/typescript/reports/native-candidate-diagnostic/
          if-no-files-found: warn
          retention-days: 7

  compare:
    name: Runner inventory and timing
    if: always() && !cancelled() && !inputs.native-candidate-diagnostic
    needs: [runner]
    runs-on: ubuntu-latest
    steps:
      - *actions-checkout
      - *actions-setup-node
      - &github-actions-setup-tools
        uses: ./.github/actions/setup-tools
        with:
          setup-node: false
      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-*
          merge-multiple: true
          path: reports
      - name: Compare inventories and outcomes
        shell: bash
        run: |
          comparison_status=0
          for os in ubuntu-latest windows-latest; do
            for mode in isolated parallel; do
              node --experimental-strip-types sdk/typescript/scripts/compare-test-reports.mts "reports/runner-$os-baseline.xml" "reports/runner-$os-$mode*.xml" >> "$GITHUB_STEP_SUMMARY" || comparison_status=1
            done
          done
          node --experimental-strip-types sdk/typescript/scripts/compare-test-reports.mts reports/runner-windows-latest-baseline.xml 'reports/runner-windows-latest-shard-*.xml' >> "$GITHUB_STEP_SUMMARY" || comparison_status=1
          exit "$comparison_status"

  mutation:
    if: ${{ !inputs.native-candidate-diagnostic }}
    name: Pure-module mutation trial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *actions-checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Stryker 10's Babel 8 requires Node 22.18+ or 24.11+.
          node-version: "24.15.0"
      - *github-actions-setup-tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile
      - name: Run mutation trial
        run: pnpm --dir sdk/typescript run test:mutation
      - name: Upload mutation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          overwrite: true
          path: sdk/typescript/reports/mutation/
          if-no-files-found: warn
          retention-days: 14
