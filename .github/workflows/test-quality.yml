name: test-quality

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_SECURITY_INTEGRATION: "0"
  CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"

jobs:
  runner:
    name: windows-latest / optional cache transition diagnostic
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CODEX_SECURITY_PROPERTY_SEED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare the native runtime from the failing run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12112197376"
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 39062427127
          path: plugins/codex-security/native/prebuilt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        uses: ./.github/actions/setup-tools
        with:
          setup-node: false
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test optional cache permission transition
        env:
          CODEX_SECURITY_TEST_TIMEOUT_MS: "120000"
          TEMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMPDIR: ${{ steps.windows-temp.outputs.path || runner.temp }}
        run: |
          pnpm --dir sdk/typescript run build:plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types sdk/typescript/scripts/run-ci-tests.mts 5/7 --seed=1 --test-name-pattern '^optional cache keeps model protection and inherited snapshot access:' --reporter-outfile=reports/runner-windows-cache-transition.xml
      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-windows-cache-transition
          overwrite: true
          path: sdk/typescript/reports/runner-windows-cache-transition.xml
          if-no-files-found: error
          retention-days: 14
