name: test-quality

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  policy-sandbox-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - uses: ./.github/actions/setup-tools
        with:
          setup-node: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Download native payload from the unchanged main implementation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-universal-50e6de4555afe4a665a7a29419ce9bda335a13c3
          path: plugins/codex-security/native/prebuilt
          github-token: ${{ github.token }}
          run-id: 39369177286
      - name: Install and build
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
          pnpm --dir sdk/typescript run build:plugin
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Reproduce scan then policy
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
        run: |
          bun test --timeout 120000 tests-ts/config.test.ts -t "allows scan helpers to write workspace files"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test --timeout 120000 tests-ts/config.test.ts -t "reads policy source without exposing credentials"
          exit $LASTEXITCODE
