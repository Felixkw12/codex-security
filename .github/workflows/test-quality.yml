name: test-quality
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  policy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-universal-50e6de4555afe4a665a7a29419ce9bda335a13c3
          run-id: 39369177286
          github-token: ${{ github.token }}
          path: plugins/codex-security/native/prebuilt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package-50e6de4555afe4a665a7a29419ce9bda335a13c3
          run-id: 39369177286
          github-token: ${{ github.token }}
          path: dist
      - uses: ./.github/actions/setup-tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: pnpm --dir sdk/typescript install --frozen-lockfile
      - run: tar -xzf (Get-ChildItem dist/*.tgz).FullName --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Run cold policy probe
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: bun test --timeout 120000 ./tests-ts/config.test.ts -t "reads policy source"
